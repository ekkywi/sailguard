# Production / on-prem full stack (control plane).
# Agents run on endpoints (Windows first), not in this compose file.
# Host ports (defaults): API 18080, Web 15180 — see docs/internal/ports.md
#
#   docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sailguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sailguard}
      POSTGRES_DB: sailguard
    volumes:
      - sailguard_pg_data:/var/lib/postgresql/data
    networks:
      - sailguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailguard -d sailguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-sailguard}"]
    volumes:
      - sailguard_redis_data:/data
    networks:
      - sailguard
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sailguard}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      SG_HTTP_ADDR: ":8080"
      SG_DB_URL: postgres://sailguard:${POSTGRES_PASSWORD:-sailguard}@postgres:5432/sailguard?sslmode=disable
      SG_REDIS_URL: redis://:${REDIS_PASSWORD:-sailguard}@redis:6379/0
      SG_JWT_SECRET: ${SG_JWT_SECRET:-change-me-in-production}
      SG_ENV: production
    ports:
      - "${SG_HTTP_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sailguard
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      SG_DB_URL: postgres://sailguard:${POSTGRES_PASSWORD:-sailguard}@postgres:5432/sailguard?sslmode=disable
      SG_REDIS_URL: redis://:${REDIS_PASSWORD:-sailguard}@redis:6379/0
      SG_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sailguard
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "${SG_WEB_PORT:-15180}:80"
    depends_on:
      - api
    networks:
      - sailguard
    restart: unless-stopped

networks:
  sailguard:
    driver: bridge

volumes:
  sailguard_pg_data:
  sailguard_redis_data:
